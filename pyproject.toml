[project]
name = "highway-engineering-agent-layer"
version = "0.1.0"
description = "公路工程业务智能体层"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.136.3",
  "pydantic==2.13.4",
  "pydantic-settings==2.16.0",
  "openai>=2.45,<3",
  "uvicorn==0.54.0",
  "langchain==1.4.6",
  "langchain-core==1.6.12",
  "langchain-openai==1.7.2",
  "langsmith==0.14.11",
  "httpx>=0.28.1,<1",
  "pymupdf>=1.24,<2",
  "openpyxl>=3.1,<4",
  "opencv-python>=4.10,<5",
  "numpy>=1.26,<3",
  "rapidocr>=3.10,<4",
  "pillow>=10,<13",
  # OCR 默认使用 CPU 版 onnxruntime；需要 GPU CUDA EP 时通过 --extra ocr-gpu 切换。
  "onnxruntime>=1.24,<1.25",
]

[project.optional-dependencies]
ocr-gpu = ["onnxruntime-gpu>=1.24,<1.25"]

[tool.uv]
package = false
# 默认使用 opencv-python 与 onnxruntime(CPU)；ocr-gpu extra 切换为 onnxruntime-gpu。
# rapidocr 会传递依赖 CPU 版 onnxruntime，当使用 GPU 版时需通过本项目的 ocr-gpu extra 覆盖。
exclude-dependencies = ["opencv-python-headless"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
