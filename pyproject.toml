[project]
name = "highway-engineering-agent-layer"
version = "0.1.0"
description = "公路工程业务智能体层"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.136.3",
  "pydantic==2.13.4",
  "pydantic-settings==2.16.0",
  "openai>=2.45,<3",
  "uvicorn==0.54.0",
  "langchain==1.4.6",
  "langchain-core==1.6.12",
  "langchain-openai==1.7.2",
  "langsmith==0.14.11",
  "httpx>=0.28.1,<1",
  "pymupdf>=1.24,<2",
  "openpyxl>=3.1,<4",
  "opencv-python>=4.10,<5",
  "numpy>=1.26,<3",
  "rapidocr>=3.10,<4",
  "pillow>=10,<13",
]

# OCR 推理运行时二选一：CPU 版 onnxruntime 或 GPU 版 onnxruntime-gpu。
# 两者提供同名 onnxruntime 模块，不能装进同一环境，因此放在互斥 extra 中。
[project.optional-dependencies]
ocr-cpu = ["onnxruntime==1.31.1"]
# 固定在 1.24.4（CUDA 12 + cuDNN 9）：1.31 起 onnxruntime-gpu 改为依赖 CUDA 13，尚未验证。
ocr-gpu = ["onnxruntime-gpu==1.24.4"]

[tool.uv]
package = false
# 统一使用 opencv-python；忽略 rapidocr 可能声明的 headless 版本，避免两份 cv2。
exclude-dependencies = ["opencv-python-headless"]
# ocr-cpu 与 ocr-gpu 互斥，uv 拒绝同时启用，避免两种 ONNX Runtime 覆盖同一个顶层模块。
conflicts = [[{ extra = "ocr-cpu" }, { extra = "ocr-gpu" }]]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "T20"]

[tool.ruff.lint.per-file-ignores]
# CLI 脚本和测试通过标准输出汇报结果，不属于业务路径。
"scripts/**" = ["T20"]
"tests/**" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
# 覆盖整个主应用，包括 Agent 和 OCR；不通过排除业务目录绕过诊断。
include = ["app"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# 当前基线约 90%，门槛略低以防回退；新增核心逻辑应同步补测试。
fail_under = 85

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true