[project]
name = "qwen-business-dev"
version = "0.2.0"
description = "Qwen 业务智能体 API：日志总结、意图识别、对话与流程规划"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.136.3",
  "pydantic==2.13.4",
  "pydantic-settings==2.16.0",
  "openai==2.43.0",
  "uvicorn==0.54.0",
]

[tool.uv]
package = false

# 从本机已缓存 wheel 的 METADATA 读取，允许离线解析跨平台依赖。
# 仅适用于这两个精确版本；升级它们时移除对应条目以重新读取元数据。
[[tool.uv.dependency-metadata]]
name = "pydantic-core"
version = "2.46.4"
requires-python = ">=3.9"
requires-dist = ["typing-extensions>=4.14.1"]

[[tool.uv.dependency-metadata]]
name = "jiter"
version = "0.15.0"
requires-python = ">=3.9"
