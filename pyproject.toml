[project]
name = "qwen-business-dev"
version = "0.3.0"
description = "基于 LangChain 的 Qwen 业务智能体 API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.136.3",
  "pydantic==2.13.4",
  "pydantic-settings==2.16.0",
  "openai>=2.45,<3",
  "uvicorn==0.54.0",
  "langchain==1.4.6",
  "langchain-core==1.6.12",
  "langchain-openai==1.7.2",
  "langsmith==0.14.11",
  "httpx>=0.28.1,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
