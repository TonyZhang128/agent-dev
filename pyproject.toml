[project]
name = "highway-engineering-agent-layer"
version = "0.1.0"
description = "公路工程业务智能体层"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.136.3",
  "pydantic==2.13.4",
  "pydantic-settings==2.16.0",
  "openai>=2.45,<3",
  "uvicorn==0.54.0",
  "langchain==1.4.6",
  "langchain-core==1.6.12",
  "langchain-openai==1.7.2",
  "langsmith==0.14.11",
  "httpx>=0.28.1,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
