name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.19"
          python-version: "3.12"
          enable-cache: true
      - run: for script in scripts/prod/*.sh; do bash -n "$script"; done
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff check app tests scripts
      - run: uv run --locked ruff format --check app tests scripts
      - run: uv run --locked python -m unittest discover -s tests -v
